# Clippy configuration, read by `cargo clippy` locally and in CI.

# Tests unwrap instead of using `?` so a failure reports its exact location.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true

# Function size limits: at most 5 parameters, 100 lines per function. too_many_lines is
# a pedantic lint (on in the workspace lint table); too_many_arguments is on by default.
too-many-arguments-threshold = 5
too-many-lines-threshold = 100

# Product and protocol names that doc_markdown should not ask to backtick. ".." keeps
# clippy's defaults (GitHub, WebAssembly, ...).
doc-valid-idents = ["..", "Hippius", "hipc", "hippius"]

# serde_json's `preserve_order` makes `Map::remove` a `swap_remove`, which moves the last
# field into the gap and so reorders the server's fields. `shift_remove` keeps the order.
disallowed-methods = [
  { path = "serde_json::Map::remove", reason = "it reorders the fields; use `shift_remove`" },
  { path = "serde_json::Map::remove_entry", reason = "it reorders the fields; use `shift_remove_entry`" },
  { path = "serde_json::Map::swap_remove", reason = "it reorders the fields; use `shift_remove`" },
  { path = "serde_json::Map::swap_remove_entry", reason = "it reorders the fields; use `shift_remove_entry`" },
  { path = "serde_json::map::OccupiedEntry::remove", reason = "it reorders the fields; use `shift_remove` on the map" },
  { path = "serde_json::map::OccupiedEntry::remove_entry", reason = "it reorders the fields; use `shift_remove_entry` on the map" },
]
