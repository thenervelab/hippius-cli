# cargo-deny policy. The `deny` job in .github/workflows/ci.yml runs `cargo deny check` (blocking,
# never continue-on-error). Vulnerable and unmaintained crates are denied by cargo-deny's defaults;
# yanked and unsound are set explicitly below because their defaults are weaker (warn, and direct
# dependencies only).

[graph]
all-features = true

[advisories]
# Every ignore needs an advisory id and a reason, e.g.
# { id = "RUSTSEC-0000-0000", reason = "not reachable: we never call X" }
ignore = []
yanked = "deny"
unsound = "all"

[licenses]
# Permissive licenses only. Adding one is a deliberate, reviewed decision.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# A shared allow-list is broader than any one repo needs; do not warn on unused entries.
unused-allowed-license = "allow"

# Unpublished crates (`publish = false`, typical for applications) need no license field.
[licenses.private]
ignore = true

[bans]
# Deny, unlike the house template's warn: the duplicates hipc carries are few and known, so
# each is skipped below with its reason, and a new one fails instead of passing unseen.
multiple-versions = "deny"
skip = [
  # The digest family. sha2 0.11, blake2 0.11 and pbkdf2 0.13 are on digest 0.11;
  # ed25519-dalek 2, crypto_box 0.9 and schnorrkel 0.11 still build digest 0.10 and its
  # helpers (Cargo.toml, the sha2 entry). They go when those crates move.
  { crate = "digest@0.10", reason = "ed25519-dalek 2, crypto_box 0.9 and schnorrkel 0.11 are on digest 0.10" },
  { crate = "block-buffer@0.10", reason = "digest 0.10" },
  { crate = "crypto-common@0.1", reason = "digest 0.10" },
  { crate = "sha2@0.10", reason = "ed25519-dalek 2 and schnorrkel 0.11" },
  { crate = "blake2@0.10", reason = "crypto_box 0.9" },
  { crate = "cpufeatures@0.2", reason = "curve25519-dalek 4, sha2 0.10, poly1305 0.8 and keccak 0.1" },
  # Proc-macro crates, built for the host only: clap, serde and thiserror derive with syn 3,
  # the dalek, zerocopy and zeroize derives with syn 2.
  { crate = "syn@2", reason = "curve25519-dalek-derive, zerocopy-derive and zeroize_derive" },
]
# `*` version requirements are never allowed; workspace path dependencies are exempt.
wildcards = "deny"
allow-wildcard-paths = true
# TLS is rustls with bundled roots (Cargo.toml, the ureq entry): no system OpenSSL, so a
# release binary runs on a host without it.
deny = [
  { crate = "openssl-sys", reason = "TLS is rustls only" },
  { crate = "openssl", reason = "TLS is rustls only" },
  { crate = "native-tls", reason = "TLS is rustls only" },
]
# No anyhow/eyre ban here: `bans.deny` matches the whole graph, transitive dependencies
# included, while only the library crate must not use them; code review checks the library
# crate's manifest and sources for them.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# webpki-roots is Mozilla's CA root list, which ureq bundles for HTTPS. Its data license is
# CDLA-Permissive-2.0, a permissive license. The exception is scoped to that one crate.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# CC0-1.0, a public-domain dedication, for the rust-bitcoin crates only: the BIP-39 phrase
# parser that reads a gamma hotkey, and its helpers.
[[licenses.exceptions]]
crate = "bip39"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
crate = "bitcoin_hashes"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
crate = "hex-conservative"
allow = ["CC0-1.0"]
