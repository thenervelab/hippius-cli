# The PyPI package `hippius`: a binary-only wheel that installs the `hipc` command, the
# way ruff and uv ship their Rust binaries. maturin builds crates/hippius-cli and puts its
# `hipc` binary in the wheel's scripts; there is no Python code. The version is the workspace
# version from Cargo.toml. The package is `hippius` and the command is `hipc`; `hipc` on PyPI
# is an unrelated project.

# One exact maturin, the one release.yml builds the wheels with (`maturin-version`), so
# Dependabot (the `pip` entry in .github/dependabot.yml) proposes each new release here, and a
# test fails until release.yml names the same version.
[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "hippius"
dynamic = ["version"]
description = "hipc, the Hippius command-line tool"
readme = "README.md"
license = "MIT OR Apache-2.0"
# Both names are symlinks to the files at the repository root. maturin 1.16 refuses `..` in
# a license-files glob, and it follows the links, so the wheel and the sdist carry the texts.
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/thenervelab/hippius-cli"

[tool.maturin]
bindings = "bin"
manifest-path = "../../crates/hippius-cli/Cargo.toml"
