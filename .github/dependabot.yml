version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # A release is taken only once it is two weeks old, the rule every pin in this repository
    # follows.
    cooldown:
      default-days: 14
    groups:
      # Minor and patch releases together; a major comes on its own, so one breaking crate
      # does not hold back the rest.
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The kubeconfig and node-operation crypto moves as one set: crypto_box 0.9 (its latest
      # stable release) uses curve25519-dalek 4 and getrandom 0.2, so a major of
      # any of these alone builds a second curve or a second RNG next to the first. Move them
      # together, by hand, once a stable crypto_box uses curve25519-dalek 5.
      - dependency-name: crypto_box
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: ed25519-dalek
        update-types: [version-update:semver-major]
      - dependency-name: curve25519-dalek
        update-types: [version-update:semver-major]
      - dependency-name: getrandom
        update-types: [version-update:semver-major, version-update:semver-minor]
      # The RustCrypto hashes share one digest release: a breaking sha2, blake2 or pbkdf2 (and
      # the hmac it builds) alone does not build against the others, so they move together, by
      # hand.
      - dependency-name: sha2
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: blake2
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: pbkdf2
        update-types: [version-update:semver-major, version-update:semver-minor]
  # maturin, which builds the PyPI wheels: packaging/pypi/pyproject.toml pins it, and
  # .github/actions/release-build repeats the pin as `maturin-version`, which Dependabot
  # cannot read. A test fails until the two agree, so a bump here is finished by hand there.
  - package-ecosystem: pip
    directory: /packaging/pypi
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  # The workflows, and the release action, whose steps pin actions of their own.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
