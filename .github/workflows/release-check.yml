name: Release check

# Builds every release target, runs each one the runner can execute, and packs each twice to
# check the tarball is reproducible, without publishing anything. It runs only
# when started by hand, to save runner time: `gh workflow run release-check.yml`. Start it before
# tagging a release, so a broken cross-compile shows before the tag.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  release-build:
    # Builds both macOS release targets, on the image release.yml builds them on, and runs
    # the arm64 binary. The x86_64 binary is never run here: Rosetta is not assumed on the
    # runner.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Remap the build paths
        # As release.yml: fixed names for the checkout and the cargo home.
        run: >-
          echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=/build
          --remap-path-prefix=${CARGO_HOME:-${HOME}/.cargo}=/cargo" >> "${GITHUB_ENV}"
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Runs
        run: |
          bin=target/aarch64-apple-darwin/release/hipc
          "${bin}" --version
          "${bin}" version
          "${bin}" schema > /dev/null
      - name: The tarball is reproducible
        # hipc is built a second time from scratch, and both builds must pack to the same
        # bytes: the build and the packing are reproducible, not only the packing.
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            scripts/package.sh "target/${target}/release/hipc" "${RUNNER_TEMP}/a.tar.gz"
            cargo clean --release --target "${target}" -p hippius-cli -p hippius
            cargo build --release --locked --target "${target}"
            scripts/package.sh "target/${target}/release/hipc" "${RUNNER_TEMP}/b.tar.gz"
            cmp "${RUNNER_TEMP}/a.tar.gz" "${RUNNER_TEMP}/b.tar.gz"
          done

  release-build-linux:
    # The Linux release targets, each built natively, so the C in ring compiles without a
    # cross toolchain, and each binary can run on the runner that built it. musl links
    # statically, so one binary runs on any distribution.
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      # As release.yml: cc-rs reads the compiler for the target it builds.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools
      - run: rustup toolchain install
      - run: rustup target add "${TARGET}"
      - name: Remap the build paths
        # As release.yml: fixed names for the checkout and the cargo home.
        run: >-
          echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=/build
          --remap-path-prefix=${CARGO_HOME:-${HOME}/.cargo}=/cargo" >> "${GITHUB_ENV}"
      - name: Build
        run: cargo build --release --locked --target "${TARGET}"
      - name: Static, and runs
        run: |
          bin="target/${TARGET}/release/hipc"
          file "${bin}"
          file "${bin}" | grep -Eq 'statically linked|static-pie linked'
          "${bin}" --version
          "${bin}" version
          "${bin}" schema > /dev/null
      - name: The tarball is reproducible
        # As on macOS: a second build from scratch packs to the same bytes.
        run: |
          bin="target/${TARGET}/release/hipc"
          scripts/package.sh "${bin}" "${RUNNER_TEMP}/a.tar.gz"
          cargo clean --release --target "${TARGET}" -p hippius-cli -p hippius
          cargo build --release --locked --target "${TARGET}"
          scripts/package.sh "${bin}" "${RUNNER_TEMP}/b.tar.gz"
          cmp "${RUNNER_TEMP}/a.tar.gz" "${RUNNER_TEMP}/b.tar.gz"
