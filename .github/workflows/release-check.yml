name: Release check

# Rehearses the release build without publishing anything: every release target is built as
# release.yml builds it, through the same action, each binary the runner can execute is run,
# each tarball is packed twice to check it is reproducible, and each PyPI wheel is built. It
# runs only when started by hand, to save runner time: `gh workflow run release-check.yml`.
# Start it before tagging a release, so a broken cross-compile or wheel shows before the tag.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  release-build:
    # The targets and runner images of release.yml's `build`.
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-build # zizmor: ignore[self-repository]
        with:
          target: ${{ matrix.target }}
          package: tarball
      - name: The tarball is reproducible
        # The two workspace crates are rebuilt from scratch, with the flags the action put in
        # the job's environment, and both builds must pack to the same bytes: the build and
        # the packing are reproducible, not only the packing. The dependencies are reused.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/${TARGET}/release/hipc"
          scripts/package.sh "${bin}" "${RUNNER_TEMP}/a.tar.gz"
          cargo clean --release --target "${TARGET}" -p hippius-cli -p hippius
          cargo build --release --locked --target "${TARGET}"
          scripts/package.sh "${bin}" "${RUNNER_TEMP}/b.tar.gz"
          cmp "${RUNNER_TEMP}/a.tar.gz" "${RUNNER_TEMP}/b.tar.gz"

  wheels:
    # The targets and runner images of release.yml's `pypi-wheels`. The wheels are built and
    # dropped: nothing is uploaded.
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-build # zizmor: ignore[self-repository]
        with:
          target: ${{ matrix.target }}
          package: wheel
